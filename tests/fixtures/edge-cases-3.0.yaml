openapi: 3.0.3
info:
  title: Edge cases
  version: 2.0.0
paths:
  /accounts/{accountId}/files:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: listFiles
      tags: [files]
      parameters:
        - name: page
          in: query
          schema: { type: integer, format: int32, minimum: 0, exclusiveMinimum: true }
        - name: sort
          in: query
          schema: { type: string, enum: [name, -name, size] }
        - name: Authorization
          in: header
          required: true
          schema: { type: string, pattern: '^Bearer .+$' }
      responses:
        '200':
          description: Files
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                items: { $ref: '#/components/schemas/File' }
    post:
      operationId: uploadFile
      tags: [files]
      requestBody:
        content:
          application/vnd.api+json:
            schema: { $ref: '#/components/schemas/Upload' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        4XX:
          description: Client error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /shapes:
    post:
      operationId: createShape
      tags: [geometry]
      deprecated: true
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Shape' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: string
                  - type: number
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    File:
      type: object
      required: [id, name, size, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        size: { type: integer, format: int64, minimum: 0 }
        ratio: { type: number, format: float, minimum: 0, maximum: 1, exclusiveMaximum: true }
        kind:
          type: string
          enum: [document, image, null]
          nullable: true
        checksum: { type: string, format: byte, nullable: true }
        labels:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        homepage: { type: string, format: uri }
        "content-type": { type: string }
    Upload:
      type: object
      required: [fileName]
      properties:
        fileName: { type: string, minLength: 1 }
        description: { type: string, default: '' }
        visibility:
          type: string
          enum: [private, public]
          default: private
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
    Shape:
      oneOf:
        - $ref: '#/components/schemas/Circle'
        - $ref: '#/components/schemas/Rect'
      discriminator:
        propertyName: kind
        mapping:
          circle: '#/components/schemas/Circle'
          rect: '#/components/schemas/Rect'
    ShapeBase:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
        label: { type: string, nullable: true }
    Circle:
      allOf:
        - $ref: '#/components/schemas/ShapeBase'
        - type: object
          required: [radius]
          properties:
            kind: { type: string, enum: [circle] }
            radius: { type: number, minimum: 0, exclusiveMinimum: true }
    Rect:
      allOf:
        - $ref: '#/components/schemas/ShapeBase'
        - type: object
          required: [width, height]
          properties:
            kind: { type: string, enum: [rect] }
            width: { type: number }
            height: { type: number }
